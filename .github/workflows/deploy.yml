name: Deploy

# master への push（PR のマージを含む）でビルドして S3 にアップロードし、本番サイトに対して E2E テストを実行する。
# lint・テストは master のルールセットで、マージ前に CI が通っていることを必須にしているため、ここでは実行しない
on:
  push:
    branches: [master]

# 連続でマージされた場合に、古いデプロイが新しいデプロイを上書きしないようにする。
# 本番の E2E テストの実行中に次のデプロイが始まらないよう、ジョブではなくワークフロー全体で直列にする
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CloudFront のキャッシュ削除の完了待ちを含む
    timeout-minutes: 20
    # Secret・Variable は Environment「production」に登録する。
    # Environment を指定すると OIDC の sub が repo:tcode-dev/makeSql:environment:production になるので、
    # IAM ロールの信頼ポリシーもこの値に合わせること
    environment: production
    permissions:
      # OIDC で AWS の IAM ロールを引き受けるために必要
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      # ファイル名にハッシュが付くアセットは長くキャッシュさせる。
      # 古いバージョンのファイルは削除する。デプロイ前に開いた画面で読み込めなかったときは、main.ts で再読み込みして最新のバージョンにする
      - run: >
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets"
          --delete
          --cache-control "public, max-age=31536000, immutable"
      # index.html などは常に最新を取りに行かせる
      - run: >
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}"
          --delete
          --exclude "assets/*"
          --cache-control "no-cache"
      # CloudFront に残っている古いキャッシュを削除する（"/*" はパス 1 件として数えられる）
      - id: invalidation
        run: >
          echo "id=$(aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
          --query Invalidation.Id
          --output text)" >> "$GITHUB_OUTPUT"
      # 削除が終わるまで待ち、本番の E2E テストが古いキャッシュに対して実行されないようにする
      - run: >
          aws cloudfront wait invalidation-completed
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --id "${{ steps.invalidation.outputs.id }}"

  # デプロイした本番サイトに対して E2E テストを実行する。
  # 失敗したときは GitHub Actions の通知 (ワークフローを実行したユーザーへのメールなど) で気づけるようにする
  test-e2e-production:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ci.yml の test-e2e と同じイメージ。@playwright/test と同じバージョンにすること
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # イメージの Node ではなく、ほかのジョブと同じバージョンに揃える。npm のキャッシュも効かせる
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          BASE_URL: https://makesql.tcode.dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7
