name: CI

on:
  # master はルールセットで、マージ前に CI が通っていることを必須にしているため実行しない
  push:
    branches-ignore: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # compose.yaml の app サービスと同じバージョン
          node-version: 26
          cache: npm
      - run: npm ci
      # npm run lint は --fix 付きのため、CI では修正せずにチェックだけ行う
      - run: npx eslint .

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run

  test-e2e:
    runs-on: ubuntu-latest
    # compose.yaml の e2e サービスと同じイメージ。@playwright/test と同じバージョンにすること
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
