name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # compose.yaml の app サービスと同じバージョン
          node-version: 26
          cache: npm
      - run: npm ci
      # npm run lint は --fix 付きのため、CI では修正せずにチェックだけ行う
      - run: npx eslint .

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run

  test-e2e:
    runs-on: ubuntu-latest
    # compose.yaml の e2e サービスと同じイメージ。@playwright/test と同じバージョンにすること
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # master への push（PR のマージを含む）で、すべてのチェックが通ったらビルドして S3 にアップロードする
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint, test-unit, test-e2e]
    runs-on: ubuntu-latest
    # Secret・Variable は Environment「production」に登録する。
    # Environment を指定すると OIDC の sub が repo:tcode-dev/makeSql:environment:production になるので、
    # IAM ロールの信頼ポリシーもこの値に合わせること
    environment: production
    # 連続でマージされた場合に、古いデプロイが新しいデプロイを上書きしないようにする
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      # OIDC で AWS の IAM ロールを引き受けるために必要
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      # ファイル名にハッシュが付くアセットは長くキャッシュさせる
      - run: >
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets"
          --delete
          --cache-control "public, max-age=31536000, immutable"
      # index.html などは常に最新を取りに行かせる
      - run: >
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}"
          --delete
          --exclude "assets/*"
          --cache-control "no-cache"
      # CloudFront に残っている古いキャッシュを削除する（"/*" はパス 1 件として数えられる）
      - run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
