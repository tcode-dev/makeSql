services:
  app:
    image: node:26-slim
    working_dir: /app
    command: npm run dev
    ports:
      - '80:80'
    volumes:
      - .:/app
      # ホスト (macOS など) とコンテナでネイティブバイナリが異なるため、node_modules はコンテナ専用のボリュームに分ける
      - node_modules:/app/node_modules

  # e2e テスト用。@playwright/test と同じバージョンのイメージを使うこと
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    command: npm run test:e2e
    # Chromium のメモリ不足によるクラッシュを防ぐ (Playwright 公式の推奨設定)
    ipc: host
    init: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # docker compose up では起動せず、docker compose run e2e で明示的に実行する
    profiles:
      - e2e

volumes:
  node_modules:
